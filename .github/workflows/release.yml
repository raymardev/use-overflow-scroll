name: Release

# Publica en npm mediante trusted publishing (OIDC): npm confía en este workflow
# de este repositorio, así que no hay ningún token de larga duración que rotar ni
# que se pueda filtrar. npm genera además la atestación de procedencia sola.
#
# Requiere una configuración única en npmjs.com — ver README, sección "Releasing".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # imprescindible: sin esto no se emite el token OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing necesita npm >= 11.5.1. Las versiones anteriores
      # ignoran OIDC en silencio y fallan pidiendo autenticación.
      - name: Actualizar npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Comprobar que el tag coincide con la versión del package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pkg

      - name: Comprobar que import y require resuelven en el paquete empaquetado
        run: |
          npm pack --silent
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"c","private":true,"version":"1.0.0"}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/use-overflow-scroll-*.tgz react@18 react-dom@18
          node -e "const m=require('use-overflow-scroll'); if (typeof m.default!=='function') throw new Error('CJS default no invocable')"
          node --input-type=module -e "import h from 'use-overflow-scroll'; if (typeof h!=='function') throw new Error('ESM default no invocable')"

      - name: Publicar
        run: npm publish
