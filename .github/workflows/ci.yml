name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    name: test · react ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # React 17 no aparece aquí a propósito: Testing Library monta con
      # createRoot, que no existe en 17. La compatibilidad con 17 se cubre en el
      # job `types`, que es lo que el rango de peerDependencies promete.
      - name: Instalar React ${{ matrix.react }}
        if: matrix.react != '18'
        run: |
          npm install --no-save \
            react@${{ matrix.react }} react-dom@${{ matrix.react }} \
            @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pkg

  types:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        types: ["17", "18", "19"]
    name: types · @types/react ${{ matrix.types }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solo se cambian los tipos, no el runtime: los paquetes @types no
      # declaran peers sobre react, así que no hay conflicto de resolución y se
      # comprueba el rango completo de peerDependencies a nivel de compilación.
      - name: Instalar @types/react ${{ matrix.types }}
        run: npm install --no-save @types/react@${{ matrix.types }}
      - run: npm run typecheck
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    name: package contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verificar el contenido del tarball
        run: |
          npm pack --silent
          echo "--- contenido ---"
          tar tzf use-overflow-scroll-*.tgz
          # Ambas salidas son obligatorias: la ausencia de dist/ rompio la 1.0.1.
          tar tzf use-overflow-scroll-*.tgz | grep -q 'package/dist/esm/index.js'
          tar tzf use-overflow-scroll-*.tgz | grep -q 'package/dist/cjs/index.js'
          tar tzf use-overflow-scroll-*.tgz | grep -q 'package/dist/esm/index.d.ts'
          tar tzf use-overflow-scroll-*.tgz | grep -q 'package/dist/cjs/index.d.ts'
          # Los tests nunca deben publicarse.
          ! tar tzf use-overflow-scroll-*.tgz | grep -q '__tests__'
      - name: Comprobar que import y require resuelven de verdad
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"c","private":true,"version":"1.0.0"}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/use-overflow-scroll-*.tgz react@18 react-dom@18
          node -e "const m=require('use-overflow-scroll'); if (typeof m.default!=='function') throw new Error('CJS default no invocable')"
          node --input-type=module -e "import h from 'use-overflow-scroll'; if (typeof h!=='function') throw new Error('ESM default no invocable')"
